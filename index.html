    <script>
      (() => {
        const host = window.location.hostname;
        if (host === "localhost" || host === "127.0.0.1") return;

        const imageUrl = (src, width, quality) => {
          const params = new URLSearchParams({
            url: new URL(src, window.location.origin).href,
            w: String(width),
            fm: "webp",
            q: String(quality),
          });
          return `/.netlify/images?${params.toString()}`;
        };

        document.documentElement.style.setProperty("--desktop-background-image", `url("${imageUrl("/assets/glass_ref_background.webp", 1600, 76)}")`);
        document.documentElement.style.setProperty("--mobile-background-image", `url("${imageUrl("/assets/glass_ref_background.webp", 920, 74)}")`);
      })();
    </script>
